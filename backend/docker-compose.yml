services:
  # MONGO-EXPRESS
  mongo-dashboard:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://host.docker.internal:40001,host.docker.internal:40002,host.docker.internal:40003/beachudb?replicaSet=beachu_set"
    
  # REDIS DB
  redis:
    image: redis    

  # BEACHU WEBSERVICE
  webservice:
    image: beachu
    environment:
      #NODE_ENV: production
      MONGO_HOST: host.docker.internal
      MONGO_PORT1: 40001
      MONGO_PORT2: 40002
      MONGO_PORT3: 40003
      MONGO_DB: beachudb
      WEB_SERVICE_PORT: 3000
      HASH_AUTH: cef05de33f37405ddcf8f5238d00b1a0ad6965674ff0c22593be057070d77e4e
      CLUSTERS: 'true'
      REDIS_URL: redis://redis

    ports:
      - 3000:3000
    restart: always
    deploy:
      mode: replicated
      replicas: 3
      